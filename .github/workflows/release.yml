name: 'Publish and Release'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RikkaTracker/RikkaTracker.csproj

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content RikkaTracker/RikkaTracker.csproj
          $version = $xml.Project.PropertyGroup.Version
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "Version found: $version"

      - name: Publish Light (Framework-dependent)
        run: |
          dotnet clean RikkaTracker/RikkaTracker.csproj
          dotnet publish RikkaTracker/RikkaTracker.csproj -c Release -r win-x64 --self-contained false -o ./publish/light

      - name: Publish Portable (Self-contained)
        run: |
          dotnet clean RikkaTracker/RikkaTracker.csproj
          dotnet publish RikkaTracker/RikkaTracker.csproj -c Release -r win-x64 -p:IsPortable=true -o ./publish/portable

      - name: Create Artifacts
        run: |
          $version = "${{ env.VERSION }}"
          # Zip Portable
          Compress-Archive -Path ./publish/portable/* -DestinationPath RikkaTracker-$version-win-x64-portable.zip
          # Zip Light
          Compress-Archive -Path ./publish/light/* -DestinationPath RikkaTracker-$version-win-x64-light.zip
          # Copy raw EXE for updater
          Copy-Item ./publish/portable/RikkaTracker.exe RikkaTracker-$version-win-x64.exe

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          name: 'RikkaTracker v${{ env.VERSION }}'
          files: |
            RikkaTracker-*.zip
            RikkaTracker-*.exe
          body: |
            ## RikkaTracker v${{ env.VERSION }}
            
            ### 下载说明
            - **Portable.zip**: 绿色自包含版（已开启压缩与剪裁，解压即用）。
            - **Light.zip**: 轻量依赖版（体积极小，需本地已安装 .NET 8）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
