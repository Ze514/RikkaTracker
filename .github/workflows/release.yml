name: 'Publish and Release'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  # 1. 构建轻量依赖版 (Framework-dependent)
  build-light:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RikkaTracker/RikkaTracker.csproj

      - name: Publish Light (Framework-dependent)
        run: |
          # 显式清理
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue RikkaTracker/bin
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue RikkaTracker/obj
          
          dotnet publish RikkaTracker/RikkaTracker.csproj `
            -c Release `
            -r win-x64 `
            --no-self-contained `
            -o ./publish/light

      - name: Inspect Light Output
        run: |
          echo "Listing files in ./publish/light:"
          Get-ChildItem -Recurse ./publish/light | Select-Object FullName, @{Name="Size(MB)";Expression={"{0:N2}" -f ($_.Length / 1MB)}}

      - name: Upload Light Artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-build
          path: ./publish/light
          if-no-files-found: error

  # 2. 构建自包含便携版 (Self-contained)
  build-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore RikkaTracker/RikkaTracker.csproj

      - name: Publish Portable (Self-contained)
        run: |
          # 显式清理
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue RikkaTracker/bin
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue RikkaTracker/obj
          
          dotnet publish RikkaTracker/RikkaTracker.csproj `
            -c Release `
            -r win-x64 `
            -p:IsPortable=true `
            -o ./publish/portable

      - name: Inspect Portable Output
        run: |
          echo "Listing files in ./publish/portable:"
          Get-ChildItem -Recurse ./publish/portable | Select-Object FullName, @{Name="Size(MB)";Expression={"{0:N2}" -f ($_.Length / 1MB)}}

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-build
          path: ./publish/portable
          if-no-files-found: error

  # 3. 打包并创建 Release
  create-release:
    needs: [build-light, build-portable]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Light build
        uses: actions/download-artifact@v4
        with:
          name: light-build
          path: ./artifacts/light

      - name: Download Portable build
        uses: actions/download-artifact@v4
        with:
          name: portable-build
          path: ./artifacts/portable

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content RikkaTracker/RikkaTracker.csproj
          # SelectSingleNode 直接定位 <Version> 元素，不受多个 PropertyGroup 影响
          $version = $xml.SelectSingleNode("//Version").InnerText.Trim()
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "Version found: $version"

      - name: Prepare Release Files
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          # 准备 Portable 版 EXE
          Copy-Item ./artifacts/portable/RikkaTracker.exe RikkaTracker-v$version-Portable.exe
          # 准备 Light 版 EXE
          Copy-Item ./artifacts/light/RikkaTracker.exe RikkaTracker-v$version-Light.exe

      # ============================================================
      # @Author: trae + deepseek-v4-flash
      # @Date:   2026-06-23
      # @Desc:   打包 Chrome 扩展为 zip 压缩包，内部结构为
      #          "RikkaTracker Sentry.zip/extension/manifest.json"
      # ============================================================
      - name: Package Chrome Extension
        shell: pwsh
        run: |
          # 创建临时文件夹，将扩展文件放入 "extension" 子目录
          $extSrc  = "WebExtensions/Chrome"
          $tempDir = "./temp-ext-pack"
          $extDir  = "$tempDir/extension"
          
          New-Item -ItemType Directory -Force -Path $extDir | Out-Null
          
          # 复制所有扩展文件到 extension 目录
          Copy-Item -Recurse -Force "$extSrc/*" $extDir
          
          # 压缩为 "RikkaTracker Sentry.zip"
          Compress-Archive -Path "$tempDir/*" -DestinationPath "RikkaTracker Sentry.zip" -Force
          
          # 清理临时目录
          Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
          
          echo "Chrome extension packaged: RikkaTracker Sentry.zip"
          # 验证压缩包内部结构
          $zipPath = "RikkaTracker Sentry.zip"
          if (Test-Path $zipPath) {
            $zipInfo = Get-Item $zipPath
            echo "Zip size: $("{0:N2}" -f ($zipInfo.Length / 1MB)) MB"
            # 列出 zip 内部文件结构
            echo "Contents of zip:"
            & 7z l "$zipPath" | Select-String -Pattern "extension/"
          } else {
            echo "ERROR: Zip file not created!"
            exit 1
          }

      # ============================================================
      # @Author: trae + deepseek-v4-flash
      # @Date:   2026-06-24
      # @Desc:   使用 WiX Toolset 分别将 Portable 和 Light 版单文件 EXE
      #          打包为 MSI 安装包，以适配 Microsoft Store 上架要求。
      #          MSI 采用 perUser 安装范围，静默安装时由 Store 自动使用
      #          /qn 开关，无需提供返回代码。
      #          基于 RikkaTracker.wxs 配置生成，包含开始菜单与桌面快捷方式。
      # @Modify: 2026-06-24 初始新增；2026-06-24 扩充为同时生成 Portable 和 Light 两个版本
      # ============================================================
      - name: Build MSI Installers
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}".Trim()
          # MSI Product Version 要求四段格式 x.x.x.x，若不足四段则补 .0
          # ponytail: WiX 3.x 对三段版本号会报错，这里做一次补齐，升级到 WiX 4.x 后可移除
          $msiVersion = $version
          $parts = $version.Split('.')
          if ($parts.Count -lt 4) {
            $msiVersion = $version + ".0" * (4 - $parts.Count)
          }
          echo "Original version: $version, MSI version: $msiVersion"

          # 查找 WiX Toolset（windows-latest runner 通常预装 WiX 3.x）
          $wixSearchPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v3.10\bin"
          )
          $wixBin = $wixSearchPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wixBin) {
            echo "WiX not found in common paths, searching..."
            $candleFound = Get-ChildItem "C:\Program Files*\WiX*" -Recurse -Filter "candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candleFound) {
              $wixBin = $candleFound.DirectoryName
            } else {
              throw "WiX Toolset not found on runner"
            }
          }
          $candle = Join-Path $wixBin "candle.exe"
          $light  = Join-Path $wixBin "light.exe"
          echo "Using WiX from: $wixBin"

          # 定义要打包的变体列表（名称 -> 构件的 artifact 目录名）
          $variants = @{
            "Portable" = "./artifacts/portable"
            "Light"    = "./artifacts/light"
          }

          foreach ($variant in $variants.Keys) {
            echo "========================================"
            echo "Building MSI for $variant variant..."
            echo "========================================"

            $artifactDir = $variants[$variant]
            $outputPath = (Resolve-Path $artifactDir).Path
            echo "OutputPath (EXE location): $outputPath"

            # 编译 .wxs 到 .wixobj
            # ponytail: -o 必须与值分开为两个独立参数，不能写作 -o=路径，否则 WiX 认为开关是 o=
            & $candle RikkaTracker.wxs "-dBuildVersion=$msiVersion" "-dOutputPath=$outputPath" "-o" "./RikkaTracker-$variant.wixobj"

            if ($LASTEXITCODE -ne 0) {
              throw "candle.exe failed for $variant variant with exit code $LASTEXITCODE"
            }

            # 链接生成 .msi 安装包
            & $light "./RikkaTracker-$variant.wixobj" "-o" "./RikkaTracker-v$version-$variant.msi"

            if ($LASTEXITCODE -ne 0) {
              throw "light.exe failed for $variant variant with exit code $LASTEXITCODE"
            }

            # 验证 MSI 文件生成结果
            $msiPath = "./RikkaTracker-v$version-$variant.msi"
            if (Test-Path $msiPath) {
              $msiInfo = Get-Item $msiPath
              echo "MSI created successfully: $($msiInfo.FullName)"
              echo "MSI size: $("{0:N2}" -f ($msiInfo.Length / 1MB)) MB"
            } else {
              throw "$variant MSI file not created at $msiPath"
            }
          }

          echo "========================================"
          echo "All MSI installers generated successfully."

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          name: 'RikkaTracker v${{ env.VERSION }}'
          files: |
            RikkaTracker-v*.exe
            RikkaTracker-v*.msi
            RikkaTracker Sentry.zip
          body: |
            ## RikkaTracker v${{ env.VERSION }}
            
            ### 下载说明
              - Portable: 普通版（自包含.NET 8，安装即用）。
              - Light: 轻量版（体积极小，需本地已安装 .NET 8）。
              - MSI-Portable: 安装包（基于 Portable 版打包，自包含 .NET 8）。
              - MSI-Light: 安装包（基于 Light 版打包，需本地已安装 .NET 8）。
              - Chrome Extension: RikkaTracker Sentry（Chrome 浏览器扩展）。
              - Portable: Regular edition (self-contained .NET 8).
              - Light: Lightweight edition (extremely small size, requires .NET 8 installed locally).
              - MSI-Portable: Installer package (self-contained .NET 8).
              - MSI-Light: Installer package (requires .NET 8 installed locally).
              - Chrome Extension: RikkaTracker Sentry (Chrome browser extension).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
